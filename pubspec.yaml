name: restaurant_app
description: Modern restaurant ordering app with delivery, pickup, and Stripe payments for Spain.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.4
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.3
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_stripe: ^11.4.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  intl: ^0.19.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.5
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  http: ^1.2.2
  collection: ^1.19.0
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
